[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Core metadata fields required by Poetry 1.8.x internal parser
name = "alite-backend"
version = "0.1.0"
description = "Autonomous Learning And Teaching Engine (ALITE) - Statistical & Item Analytics Engine"
authors = ["Aaron Thompson <aaron.thompson@dliflc.edu>"]
packages = [{ include = "alite_backend", from = "src" }]
package-mode = true

[tool.poetry.dependencies]
# Python 3.13 runtime constraint matching system requirements
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlmodel = "^0.0.22"
psycopg2-binary = "^2.9.10"
pandas = "^2.2.3"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
pydantic-settings = "^2.6.0"
alembic = "^1.13.3"
cytoolz = "^1.0.0"
dateparser = "^1.2.0"
sqladmin = {version = "^0.20.1", extras = ["auth"]}
email-validator = "^2.3.0"
jwt = "^1.4.0"
pyjwt = "^2.13.0"
bcrypt = "^5.0.0"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.0.0"
black = "^25.1.0"
pytest = "^8.0.0"
pylint = "^3.3.0"
pre-commit = "^4.0.0"
bandit = "^1.8.6"
ipykernel = "^7.2.0"
factory-boy = "^3.3.3"
hypothesis = "^6.155.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"