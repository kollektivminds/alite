# ==============================================================================
# ALITE Database Migration Configuration
# File: app/backend/alembic.ini
# ==============================================================================

[alembic]
# relative path from alembic.ini to the migration environment directory
script_location = alembic

# prepend the src/ directory to sys.path so env.py can import alite_backend
prepend_sys_path = src

# template used to generate migration filenames
file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during the 'revision' command
# (required for autogenerate to inspect models)
revision_environment = false

# Logging Configuration
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S